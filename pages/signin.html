<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Sign In</title>

    <link rel="icon" href="../assets/favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- Navbar -->
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <a href="../index.html" class="text-2xl font-bold text-blue-600">
            NovaTech
        </a>

        <div class="hidden md:flex space-x-6">
            <a href="../index.html" class="hover:text-blue-600">Home</a>
            <a href="./about.html" class="hover:text-blue-600">About</a>
            <a href="./contact.html" class="hover:text-blue-600">Contact</a>
            <a href="./signin.html" class="text-blue-600 font-semibold">Sign In</a>
            <a href="./signup.html" class="hover:text-blue-600">Sign Up</a>
        </div>

    </div>
</nav>


<!-- Sign In -->
<section class="min-h-screen py-16 px-6">

    <div class="max-w-md mx-auto">

        <div class="text-center mb-8">

            <div class="text-5xl mb-4">🔐</div>

            <h1 class="text-4xl font-bold mb-3">
                Welcome Back
            </h1>

            <p class="text-gray-600">
                Sign in to your NovaTech account.
            </p>

        </div>


        <div class="bg-white p-8 rounded-2xl shadow-lg">

            <form class="space-y-5">

                <div>
                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input type="email"
                           required
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500"
                           placeholder="Enter your email">
                </div>


                <div>
                    <label class="block font-semibold mb-2">
                        Password
                    </label>

                    <input type="password"
                           required
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500"
                           placeholder="Enter your password">
                </div>


                <div class="flex justify-between items-center text-sm">

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="text-blue-600">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                    Sign In
                </button>

            </form>


            <div class="border-t mt-6 pt-6 text-center">

                <p class="text-gray-600">
                    Don't have an account?
                </p>

                <a href="./signup.html"
                   class="text-blue-600 font-semibold">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</section>


<!-- Footer -->
<footer class="bg-gray-900 text-white py-8">

    <div class="text-center">

        <p class="text-gray-400">
            © 2026 NovaTech. All Rights Reserved.
        </p>

        <div class="mt-3 space-x-4">
            <a href="../index.html">Home</a>
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
        </div>

    </div>

</footer>

</body>
</html>
